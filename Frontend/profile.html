<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Bangalore Accidents Tracker</title>
  <meta name="description" content="View your submitted accident reports, geotagged locations, and verification status.">
  <link rel="stylesheet" href="css/main.css">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .profile-page {
      padding: calc(var(--app-top, 65px) + var(--space-xl)) var(--space-xl) var(--space-xl);
    }
    .profile-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-lg);
      align-items: start;
    }
    /* Profile Card */
    .profile-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      text-align: center;
      position: sticky;
      top: calc(var(--app-top, 65px) + var(--space-lg));
    }
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      margin: 0 auto var(--space-md);
      box-shadow: 0 0 30px var(--color-primary-glow);
    }
    .profile-name {
      font-size: var(--font-size-xl);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .profile-email {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      margin-bottom: var(--space-lg);
    }
    .profile-stat {
      display: flex;
      justify-content: space-around;
      margin: var(--space-lg) 0;
      padding: var(--space-md) 0;
      border-top: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
    }
    .profile-stat-item { text-align: center; }
    .profile-stat-num { font-size: var(--font-size-xl); font-weight: 800; color: var(--color-primary); }
    .profile-stat-label { font-size: var(--font-size-xs); color: var(--text-muted); }

    /* Mini Map */
    #profile-mini-map {
      width: 100%;
      height: 180px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: var(--space-md);
    }

    /* Reports List */
    .reports-panel { display: flex; flex-direction: column; gap: var(--space-md); }
    .reports-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }
    .reports-header h2 { font-size: var(--font-size-2xl); }
    .report-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }
    .report-card:hover { border-color: var(--color-border-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .report-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .report-card.fatal::before { background: var(--color-fatal); }
    .report-card.serious::before { background: var(--color-serious); }
    .report-card.minor::before { background: var(--color-minor); }
    .report-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-sm);
    }
    .report-location-name { font-size: var(--font-size-base); font-weight: 700; }
    .report-area { font-size: var(--font-size-sm); color: var(--text-muted); }
    .report-badges { display: flex; gap: var(--space-sm); flex-wrap: wrap; justify-content: flex-end; }
    .report-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
      padding: var(--space-md) 0;
      border-top: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
      margin: var(--space-md) 0;
    }
    .report-meta-item { text-align: center; }
    .report-meta-label { font-size: var(--font-size-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .report-meta-value { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
    .report-desc { font-size: var(--font-size-sm); color: var(--text-secondary); line-height: 1.5; }
    .report-proof {
      margin-top: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .report-proof img {
      width: 60px; height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .report-proof img:hover { transform: scale(1.05); }
    .report-proof-label { font-size: var(--font-size-xs); color: var(--text-muted); }

    .no-reports {
      text-align: center;
      padding: var(--space-2xl);
      color: var(--text-muted);
    }
    .no-reports-icon { font-size: 3rem; margin-bottom: var(--space-md); }
    .no-reports h3 { font-size: var(--font-size-xl); color: var(--text-secondary); margin-bottom: var(--space-md); }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      animation: fadeInUp 0.2s ease;
    }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius-md); object-fit: contain; }
    .lightbox-close { position: absolute; top: var(--space-xl); right: var(--space-xl); color: white; font-size: 2rem; cursor: pointer; }

    /* Status badges (Req 8.2) */
    .badge-status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: var(--font-size-xs);
      font-weight: 600;
    }
    .badge-status-verified {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: var(--font-size-xs);
      font-weight: 600;
    }
    .badge-status-rejected {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: var(--font-size-xs);
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .profile-layout { grid-template-columns: 1fr; }
      .profile-card { position: relative; top: auto; }
    }
    @media (max-width: 768px) {
      .profile-page { padding: calc(var(--app-top, 65px) + var(--space-md)) var(--space-md) var(--space-md); }
      .report-meta { grid-template-columns: 1fr 1fr; }
    }
  </style>
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<!-- ── Navigation ── -->
<script src="js/sidebar.js"></script>

<div class="profile-page" id="page-content"></div>

  <footer style="margin-top: var(--space-xl);">
    <p><strong>Copyright &copy; Students of DSATM CSE</strong></p>
    <p style="margin-bottom:var(--space-md); color: var(--text-muted); font-size: 14px;">Samarth, Shivkumar, Shreyas, Shreejith</p>
    <div class="footer-links" style="margin-bottom:var(--space-md);">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="report.html">Report</a>
      <a href="login.html">Login</a>
    </div>

  </footer>

<script src="js/bat-config.js"></script>
<script src="js/sos-button.js"></script>
<script src="js/db.js"></script>
<script type="module" src="js/supabase-auth.js"></script>
<script src="js/auth.js"></script>
<script>
  window.Auth.updateNavAuth();

  // Role Guard: require authenticated Supabase session (Req 3.6, 8.5)
  (async function() {
    await window.Auth.requireAuth();

    // Get user info from SupabaseAuthClient.getUser() (Req 8.4)
    var client = window.SupabaseAuthClient;
    var user = client ? await client.getUser() : null;

    if (!user) {
      // No valid session — clear any stale session first so the login page
      // does not bounce us straight back (infinite redirect loop), then
      // redirect to login with returnTo (Req 8.5)
      if (client) {
        try { await client.signOut(); } catch (e) {}
      }
      window.location.href = 'login.html?returnTo=profile.html';
      return;
    }

    var userName = (user.user_metadata && user.user_metadata.name) || user.email || 'User';
    var userEmail = user.email || '';

    // Get session for JWT token
    var session = client ? await client.getSession() : null;
    if (!session || !session.access_token) {
      window.location.href = 'login.html?returnTo=profile.html';
      return;
    }

    var page = document.getElementById('page-content');

    // Fetch reports from Supabase via API (Req 8.1, 8.2, 8.3, 8.6)
    async function fetchReports() {
      var apiBase = window.BAT_CONFIG.apiBase;
      var token = session.access_token;

      if (token.indexOf('devtoken_') === 0) return window.DB.getUserReports(user.id);

      try {
        var response = await fetch(apiBase + '/api/reports/mine', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (response.ok) return await response.json();
      } catch (_) {}
      return window.DB.getUserReports(user.id);
    }

    function renderProfile(reports) {
      var verifiedCount = reports.filter(function(r) { return r.status === 'verified'; }).length;
      var pendingCount = reports.filter(function(r) { return r.status === 'pending'; }).length;
      var rejectedCount = reports.filter(function(r) { return r.status === 'rejected'; }).length;

      page.innerHTML = '\
        <div class="profile-layout">\
          <div class="profile-card">\
            <div class="profile-avatar">' + userName.charAt(0).toUpperCase() + '</div>\
            <div class="profile-name">' + escapeHtml(userName) + '</div>\
            <div class="profile-email">' + escapeHtml(userEmail) + '</div>\
            <div class="profile-stat">\
              <div class="profile-stat-item">\
                <div class="profile-stat-num" id="p-total">' + reports.length + '</div>\
                <div class="profile-stat-label">Reports</div>\
              </div>\
              <div class="profile-stat-item">\
                <div class="profile-stat-num" id="p-verified">' + verifiedCount + '</div>\
                <div class="profile-stat-label">Verified</div>\
              </div>\
              <div class="profile-stat-item">\
                <div class="profile-stat-num" id="p-pending">' + pendingCount + '</div>\
                <div class="profile-stat-label">Pending</div>\
              </div>\
            </div>\
            <a href="report.html" class="btn btn-primary" style="width:100%;margin-bottom:var(--space-sm);">+ Report Accident</a>\
            <button class="btn btn-outline" style="width:100%;font-size:var(--font-size-sm);" id="logout-btn-profile">Logout</button>\
            <div style="margin-top:var(--space-lg);text-align:left;">\
              <div style="font-size:var(--font-size-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--space-sm);">Your Reported Locations</div>\
              <div id="profile-mini-map"></div>\
              ' + (reports.length === 0 ? '<p style="font-size:var(--font-size-xs);color:var(--text-muted);text-align:center;margin-top:8px;">No pins yet</p>' : '') + '\
            </div>\
          </div>\
          <div class="reports-panel">\
            <div class="reports-header">\
              <h2>My Reports</h2>\
              <span class="badge badge-' + (reports.length > 0 ? 'verified' : 'pending') + '">' + reports.length + ' submitted</span>\
            </div>\
            ' + renderReportsList(reports) + '\
          </div>\
        </div>\
      ';

      // Logout via Supabase Auth (Req 2.6)
      document.getElementById('logout-btn-profile').addEventListener('click', async function() {
        if (window.SupabaseAuthClient) await window.SupabaseAuthClient.signOut();
        window.location.href = 'index.html';
      });

      // Mini Map
      var miniMap = L.map('profile-mini-map', {
        center: [12.9716, 77.5946],
        zoom: 11,
        zoomControl: false,
        scrollWheelZoom: false,
        dragging: false,
        attributionControl: false
      });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd', maxZoom: 19
      }).addTo(miniMap);
      var locations = reports.filter(function(report) {
        return Number.isFinite(Number(report.latitude)) && Number.isFinite(Number(report.longitude));
      });
      var bounds = [];
      locations.forEach(function(report) {
        var latLng = [Number(report.latitude), Number(report.longitude)];
        bounds.push(latLng);
        L.marker(latLng).addTo(miniMap).bindPopup(escapeHtml(report.location || 'Reported accident'));
      });
      if (bounds.length === 1) miniMap.setView(bounds[0], 14);
      if (bounds.length > 1) miniMap.fitBounds(bounds, { padding: [18, 18] });
    }

    function renderReportsList(reports) {
      // Empty state with link to report page (Req 8.3)
      if (reports.length === 0) {
        return '\
          <div class="no-reports card">\
            <div class="no-reports-icon">📋</div>\
            <h3>No Reports Yet</h3>\
            <p style="margin-bottom:var(--space-xl);">No reports submitted yet. Help improve Bangalore\'s road safety data by reporting accidents you witness.</p>\
            <a href="report.html" class="btn btn-primary">Report Your First Accident</a>\
          </div>\
        ';
      }

      return reports.map(function(r) {
        var sev = r.severity || 'minor';
        var sevLabel = sev.charAt(0).toUpperCase() + sev.slice(1);
        var status = r.status || 'pending';
        var statusBadgeClass = getStatusBadgeClass(status);
        var statusLabel = status.charAt(0).toUpperCase() + status.slice(1);

        return '\
          <div class="report-card ' + sev + '">\
            <div class="report-top">\
              <div>\
                <div class="report-location-name">📍 ' + escapeHtml(r.location || '') + '</div>\
                <div class="report-area">' + escapeHtml(r.area || '') + '</div>\
              </div>\
              <div class="report-badges">\
                <span class="badge badge-' + sev + '">' + sevLabel + '</span>\
                <span class="badge ' + statusBadgeClass + '">' + statusLabel + '</span>\
              </div>\
            </div>\
            <div class="report-meta">\
              <div class="report-meta-item">\
                <div class="report-meta-label">Date</div>\
                <div class="report-meta-value">' + escapeHtml(r.date || 'N/A') + '</div>\
              </div>\
              <div class="report-meta-item">\
                <div class="report-meta-label">Status</div>\
                <div class="report-meta-value">' + statusLabel + '</div>\
              </div>\
              <div class="report-meta-item">\
                <div class="report-meta-label">Severity</div>\
                <div class="report-meta-value">' + sevLabel + '</div>\
              </div>\
            </div>\
            <div class="report-desc">' + escapeHtml(r.description || '') + '</div>\
          </div>\
        ';
      }).join('');
    }

    // Status badge classes (Req 8.2)
    function getStatusBadgeClass(status) {
      switch (status) {
        case 'verified': return 'badge-status-verified';
        case 'rejected': return 'badge-status-rejected';
        case 'pending':
        default: return 'badge-status-pending';
      }
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // Error state with retry control (Req 8.6)
    function renderError() {
      page.innerHTML = '\
        <div class="profile-layout">\
          <div class="profile-card">\
            <div class="profile-avatar">' + userName.charAt(0).toUpperCase() + '</div>\
            <div class="profile-name">' + escapeHtml(userName) + '</div>\
            <div class="profile-email">' + escapeHtml(userEmail) + '</div>\
            <a href="report.html" class="btn btn-primary" style="width:100%;margin-top:var(--space-lg);margin-bottom:var(--space-sm);">+ Report Accident</a>\
            <button class="btn btn-outline" style="width:100%;font-size:var(--font-size-sm);" id="logout-btn-profile">Logout</button>\
          </div>\
          <div class="reports-panel">\
            <div class="reports-header">\
              <h2>My Reports</h2>\
            </div>\
            <div class="no-reports card">\
              <div class="no-reports-icon">⚠️</div>\
              <h3>Could Not Load Reports</h3>\
              <p style="margin-bottom:var(--space-xl);">Reports could not be loaded due to a network error. Please check your connection and try again.</p>\
              <button class="btn btn-primary" id="retry-btn">Retry</button>\
            </div>\
          </div>\
        </div>\
      ';

      document.getElementById('retry-btn').addEventListener('click', loadProfile);

      document.getElementById('logout-btn-profile').addEventListener('click', async function() {
        if (window.SupabaseAuthClient) await window.SupabaseAuthClient.signOut();
        window.location.href = 'index.html';
      });
    }

    async function loadProfile() {
      // Show loading state
      page.innerHTML = '<div style="text-align:center;padding:var(--space-2xl);color:var(--text-muted);">Loading your reports...</div>';

      try {
        var reports = await fetchReports();
        renderProfile(reports);
      } catch (err) {
        console.error('[profile] Failed to fetch reports:', err);
        renderError();
      }
    }

    // Initial load
    await loadProfile();
  })();

  // Lightbox
  function openLightbox(src) {
    var lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = '<span class="lightbox-close">✕</span><img src="' + src + '" alt="Proof">';
    lb.addEventListener('click', function() { lb.remove(); });
    document.body.appendChild(lb);
  }
</script>
</body>
</html>
